    name: cybersafe
    description: A professional Cyber Crime Complaint and Awareness Management System.
    publish_to: 'none'

    version: 1.0.0+1

    environment:
        sdk: ">=3.5.0 <4.0.0"

    # ==========================================================
    # DEPENDENCIES
    # ==========================================================

    dependencies:
        flutter:
            sdk: flutter

        # --------------------------------------------------------
        # UI / Icons
        # --------------------------------------------------------

        cupertino_icons: ^1.0.8
        google_fonts: ^6.3.0

        # --------------------------------------------------------
        # Firebase
        # --------------------------------------------------------

        firebase_core: ^4.1.0
        firebase_auth: ^6.0.2
        cloud_firestore: ^6.9.0
        firebase_storage: ^13.5.0

        # --------------------------------------------------------
        # File / Image
        # --------------------------------------------------------

        image_picker: ^1.1.2
        file_picker: ^10.3.6



        # --------------------------------------------------------
        # Local Storage
        # --------------------------------------------------------

        shared_preferences: ^2.5.3

        # --------------------------------------------------------
        # HTTP / AI API
        # --------------------------------------------------------

        http: ^1.5.0

        # --------------------------------------------------------
        # URL
        # --------------------------------------------------------

        url_launcher: ^6.3.2

    # ==========================================================
    # DEV DEPENDENCIES
    # ==========================================================

    dev_dependencies:
        flutter_test:
            sdk: flutter

        flutter_lints: ^5.0.0

    # ==========================================================
    # FLUTTER
    # ==========================================================

    flutter:
        uses-material-design: true

        # ========================================================
        # APP ASSETS
        # ========================================================

        assets:
            - assets/images/
            - assets/icons/
